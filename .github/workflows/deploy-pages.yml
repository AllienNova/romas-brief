# =====================================================================
# deploy-pages.yml · ROMAS Wire Cloudflare Pages deploys
# R-106 (remediation-plan M1) · /team-build M1-completion cycle
# Anchors: ADR-0003 (Cloudflare Workers + Pages + R2) · SSOT §5 (Next 14
#   lock) · ADR-0015 v2 closed-CVE class (no Pages Router, no i18n,
#   no rewrites, no Script strategy=beforeInteractive)
# =====================================================================
#
# Deploys apps/web (reader, romasbrief.com) and apps/cms (internal,
# Cloudflare Access-gated subdomain) on every push to main.
#
# Required GitHub secrets (you provision before first run):
#   CLOUDFLARE_API_TOKEN     - Pages:Edit + Workers:Edit + Zone:Edit on the romasbrief.com zone
#   CLOUDFLARE_ACCOUNT_ID    - the AllienNova/romas-brief Cloudflare account
#   PAGES_PROJECT_WEB        - Cloudflare Pages project name for apps/web
#   PAGES_PROJECT_CMS        - Cloudflare Pages project name for apps/cms

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - turbo.json
      - tsconfig.base.json
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel deploys; let them queue

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build apps for Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      web_built: ${{ steps.build_web.outcome == 'success' }}
      cms_built: ${{ steps.build_cms.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build apps/web
        id: build_web
        run: pnpm turbo run build --filter=@romas-brief/web

      - name: Build apps/cms
        id: build_cms
        run: pnpm turbo run build --filter=@romas-brief/cms

      - name: Upload apps/web .next artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-web-next
          path: apps/web/.next
          retention-days: 7

      - name: Upload apps/cms .next artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-cms-next
          path: apps/cms/.next
          retention-days: 7

  deploy-web:
    name: Deploy apps/web to Cloudflare Pages (reader, romasbrief.com)
    needs: build
    if: needs.build.outputs.web_built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apps-web-next
          path: apps/web/.next

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.PAGES_PROJECT_WEB }}
          directory: apps/web/.next
          branch: main

  deploy-cms:
    name: Deploy apps/cms to Cloudflare Pages (internal, Access-gated)
    needs: build
    if: needs.build.outputs.cms_built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apps-cms-next
          path: apps/cms/.next

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.PAGES_PROJECT_CMS }}
          directory: apps/cms/.next
          branch: main
