name = "romas-brief-email-canary"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# SHIP-12 · Resend transactional email + delivery-webhook worker
# (the "email-transactional" role per ADR-0007 cycle-3). The on-disk dir
# name stays `email-canary` to avoid lockfile churn — the rename is
# cosmetic. POST-only. Two routes:
#   POST /webhook  Resend delivery events, Svix-signed -> bounce/complaint
#                  mirror into Supabase `subscribers`.
#   POST /send     internal transactional send (bearer-authed) via Resend.
# No cron triggers.
#
# Worker Secrets required at activation (wrangler secret put):
#   RESEND_API_KEY            (Bearer for the Resend send API)
#   RESEND_WEBHOOK_SECRET     (whsec_... — Svix signing secret for /webhook)
#   INTERNAL_SEND_SECRET      (shared bearer guarding the /send route)
#   SUPABASE_SERVICE_ROLE_KEY (sb_secret_... — subscriber PATCH writes)

[vars]
SUPABASE_URL = "https://placeholder.supabase.co"
