name = "romas-brief-cron-ingest"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# T-114 / SSOT §3 row 16: Three-edition schedule (Mon-Fri)
# APAC 22:00 UTC (prior-day), EU 06:00 UTC, Americas 11:00 UTC
[triggers]
crons = [
  "0 21 * * 0-4",  # APAC (21:00 UTC = 1h before 22:00 UTC publish, Sun-Thu)
  "0 5 * * 1-5",   # EU (05:00 UTC = 1h before 06:00 UTC publish, Mon-Fri)
  "0 10 * * 1-5"   # Americas (10:00 UTC = 1h before 11:00 UTC publish, Mon-Fri)
]

# Bindings (filled in T-115; secrets via `wrangler secret put`)
[[r2_buckets]]
binding = "RAW"
bucket_name = "romas-raw"

[vars]
SUPABASE_URL = "https://placeholder.supabase.co" # Replace with real URL when provisioned

# NEVER put SUPABASE_SERVICE_ROLE_KEY (or any secret) under [vars] — that
# section is committed plaintext. Use Worker Secrets for keys/tokens:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# Only public, non-sensitive config (e.g. SUPABASE_URL) may live in [vars].
