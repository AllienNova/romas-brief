# =====================================================================
# deploy-migrations.yml · ROMAS Brief Supabase migration deploys + pgTAP
# R-106 (remediation-plan M1) · /team-build M1-completion cycle
# Anchors: ADR-0002 (Supabase + RLS) · R-104 + R-105 (migrations +
#   pgTAP) · supabase/migrations/0001..0011 · supabase/tests/*.sql ·
#   build-2026-05-21 build-log Gate G9 deferral note (R-105 owns the
#   pgTAP runs; this workflow is its consumer).
# =====================================================================
#
# Applies Supabase migrations to the linked project on push to main
# (filtered to supabase/ changes) and runs the pgTAP test suite. Gated
# on supabase/migrations/0011_rls_policies.sql being present — if it
# isn't, fail-fast rather than push partial schema to production (per
# build-2026-05-21 qa-pass recommended CI guard).
#
# Required GitHub secrets:
#   SUPABASE_ACCESS_TOKEN     - personal access token for the supabase CLI
#   SUPABASE_PROJECT_REF      - production project ref (e.g. abcdefgh)
#   SUPABASE_DB_PASSWORD      - production database password for `db push`

name: Deploy Supabase migrations + pgTAP

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/seed.sql
      - supabase/tests/**
  workflow_dispatch:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations + run pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pre-push guard: require RLS migration before any production push.
      # Implements the systemic correction recommended by /team-qa cycle
      # build-2026-05-21 ("CI pre-push guard requiring 0011_rls_policies.sql
      # before supabase db push --linked").
      - name: Guard — require 0011_rls_policies.sql present
        run: |
          if [ ! -f "supabase/migrations/0011_rls_policies.sql" ]; then
            echo "::error::supabase/migrations/0011_rls_policies.sql missing." \
                 "Refusing to push migrations without RLS policies."
            exit 1
          fi
          echo "0011_rls_policies.sql present. Proceeding."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --include-all

      - name: Run pgTAP suite (R-105 acceptance)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase test db --linked
