name = "romas-brief-beehiiv-webhook"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# SHIP-11 · Beehiiv -> Supabase subscriber-sync webhook. POST-only.
# Auth: shared-secret custom header per ADR-0019 (Beehiiv has no native
# HMAC). No cron triggers.
# Worker Secrets required at activation (wrangler secret put):
#   BEEHIIV_WEBHOOK_SECRET    (shared secret; also set as the Beehiiv
#                              webhook's `Authorization: Bearer <secret>`)
#   SUPABASE_SERVICE_ROLE_KEY (sb_secret_... — subscriber upsert writes)

[vars]
SUPABASE_URL = "https://placeholder.supabase.co"
